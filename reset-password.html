<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | Beenorax</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f7fa;font:15px Arial;color:#17283b;padding:20px}.card{width:min(100%,430px);background:white;border:1px solid #dce5ed;border-radius:16px;padding:28px}h1{color:#071f43}label{display:block;font-size:13px;margin:14px 0 5px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd7e1;border-radius:8px}button{width:100%;padding:13px;background:#00a99a;color:white;border:0;border-radius:8px;font-weight:700;margin-top:18px}#status{font-size:13px;margin-top:12px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/asset/auth-config.js"></script></head><body><main class="card"><h1>Set a new password</h1><p>Choose a new password for your Beenorax account.</p><form id="form"><label for="password">New password</label><input id="password" type="password" minlength="8" required autocomplete="new-password"><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="8" required autocomplete="new-password"><button>Update password</button></form><div id="status" role="status"></div><p><a href="/access.html">Return to login</a></p></main><script>(()=>{const c=window.BEENORAX_AUTH_CONFIG||{},s=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,detectSessionInUrl:true}});document.getElementById('form').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('password').value;if(p!==document.getElementById('confirm').value){document.getElementById('status').textContent='Passwords do not match.';return}const {error}=await s.auth.updateUser({password:p});document.getElementById('status').textContent=error?error.message:'Password updated. You can now log in.';if(!error)setTimeout(()=>location.href='/access.html',1200)}})();</script></body></html>
