<script>
(() => {
  'use strict';

  const config = window.BEENORAX_AUTH_CONFIG;

  const $ = id => document.getElementById(id);

  if (!config || !config.supabaseUrl || !config.supabaseAnonKey) {
    const message = $('message');
    message.className = 'message error';
    message.textContent = 'Authentication configuration is missing.';
    message.style.display = 'block';
    return;
  }

  if (!window.supabase) {
    const message = $('message');
    message.className = 'message error';
    message.textContent = 'Authentication service could not be loaded. Please refresh the page.';
    message.style.display = 'block';
    return;
  }

  const sb = window.supabase.createClient(
    config.supabaseUrl,
    config.supabaseAnonKey,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );

  let currentSession = null;
  let busy = false;
  let lastLoadedToken = null;
  let accountLoadId = 0;

  function showMessage(text, type = 'info') {
    const box = $('message');
    box.textContent = text;
    box.className = 'message ' + type;
    box.style.display = 'block';
  }

  function showAccountMessage(text, type = 'info') {
    const box = $('accountMessage');
    box.textContent = text;
    box.className = 'message ' + type;
  }

  function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[char]);
  }

  async function syncCookie(session) {
    if (!session?.access_token) {
      throw new Error('No access token was found.');
    }

    const response = await fetch('/.netlify/functions/auth-session', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        access_token: session.access_token
      })
    });

    const result = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        `Session synchronisation failed (${response.status}): ${
          result.error || 'Unknown server error'
        }`
      );
    }

    if (result.ok !== true) {
      throw new Error('The server did not confirm session synchronisation.');
    }

    return result;
  }

  async function verifyAccess(session) {
    const response = await fetch('/.netlify/functions/journal-access', {
      method: 'GET',
      headers: {
        Authorization: 'Bearer ' + session.access_token
      },
      credentials: 'same-origin',
      cache: 'no-store'
    });

    const result = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        `Access verification failed (${response.status}): ${
          result.error || 'Unknown server error'
        }`
      );
    }

    return result;
  }

  function showAuth() {
    $('authSection').classList.remove('hidden');
    $('accountSection').classList.add('hidden');
  }

  function showAccount() {
    $('authSection').classList.add('hidden');
    $('accountSection').classList.remove('hidden');
  }

  function setBusy(value, buttonId) {
    busy = value;

    const button = $(buttonId);
    if (button) {
      button.disabled = value;
    }
  }

  async function loadAccount(session) {
    if (!session) {
      showAuth();
      return;
    }

    if (!session.user?.email_confirmed_at) {
      showAuth();
      showMessage(
        'Please verify your email address before accessing the journal portal.',
        'error'
      );
      return;
    }

    if (lastLoadedToken === session.access_token) {
      return;
    }

    const loadId = ++accountLoadId;

    currentSession = session;
    showAccount();

    showAccountMessage(
      'Verifying your account and journal permissions...',
      'info'
    );

    try {
      await syncCookie(session);

      if (loadId !== accountLoadId) return;

      const result = await verifyAccess(session);

      if (loadId !== accountLoadId) return;

      const profile = result.profile || {};
      const memberships = result.memberships || [];

      let html = `
        <h3>Account information</h3>

        <strong>Name:</strong>
        ${escapeHTML(profile.full_name || 'Not provided')}<br>

        <strong>Email:</strong>
        ${escapeHTML(result.user?.email || session.user.email)}<br>

        <strong>Organization:</strong>
        ${escapeHTML(profile.organization || 'Not provided')}<br>

        <strong>Account role:</strong>
        ${escapeHTML(profile.role || 'Pending assignment')}<br>
      `;

      html += '<h3>Journal permissions</h3>';

      if (memberships.length) {
        memberships.forEach(item => {
          const journal = item.journal_code === 'bjbs'
            ? 'Beenorax Biomedical Journals (BBJ)'
            : item.journal_code === 'bjba'
              ? 'Beenorax Business Intelligence Journals (BBIJ)'
              : item.journal_code;

          html += `
            <div class="membership">
              <strong>${escapeHTML(journal)}</strong><br>
              Role: ${escapeHTML(item.role)}<br>
              Status: Active
            </div>
          `;
        });
      } else {
        html += `
          <p>
            No active editorial or reviewer membership was found.
            You can still use your account as an author when
            manuscript submissions open.
          </p>
        `;
      }

      $('accountDetails').innerHTML = html;

      lastLoadedToken = session.access_token;

      showAccountMessage(
        'Your account has been verified. Dashboard access will appear when the relevant journal services are configured.',
        'success'
      );

    } catch (error) {
      if (loadId !== accountLoadId) return;

      console.error('Journal account verification error:', error);

      showAccountMessage(error.message, 'error');
    }
  }

  // Switch to sign-in
  $('loginTab').addEventListener('click', () => {
    $('loginForm').classList.remove('hidden');
    $('registerForm').classList.add('hidden');

    $('loginTab').classList.add('active');
    $('registerTab').classList.remove('active');

    $('message').style.display = 'none';
  });

  // Switch to registration
  $('registerTab').addEventListener('click', () => {
    $('registerForm').classList.remove('hidden');
    $('loginForm').classList.add('hidden');

    $('registerTab').classList.add('active');
    $('loginTab').classList.remove('active');

    $('message').style.display = 'none';
  });

  // Sign in
  $('loginForm').addEventListener('submit', async event => {
    event.preventDefault();

    if (busy) return;

    setBusy(true, 'loginButton');
    showMessage('Signing in...');

    try {
      const { data, error } = await sb.auth.signInWithPassword({
        email: $('loginEmail').value.trim(),
        password: $('loginPassword').value
      });

      if (error) throw error;

      if (!data.user?.email_confirmed_at) {
        await sb.auth.signOut();
        throw new Error('Please verify your email before signing in.');
      }

      lastLoadedToken = null;

      await loadAccount(data.session);

    } catch (error) {
      console.error('Login error:', error);
      showMessage(error.message, 'error');

    } finally {
      setBusy(false, 'loginButton');
    }
  });

  // Create account
  $('registerForm').addEventListener('submit', async event => {
    event.preventDefault();

    if (busy) return;

    setBusy(true, 'registerButton');
    showMessage('Creating your account...');

    try {
      const { data, error } = await sb.auth.signUp({
        email: $('registerEmail').value.trim(),
        password: $('registerPassword').value,
        options: {
          emailRedirectTo: location.origin + '/journal-access.html',
          data: {
            full_name: $('fullName').value.trim(),
            organization: $('organization').value.trim(),
            requested_role: $('requestedRole').value
          }
        }
      });

      if (error) throw error;

      if (data.session && data.user?.email_confirmed_at) {
        lastLoadedToken = null;
        await loadAccount(data.session);

      } else {
        showMessage(
          'Registration received. Check your email and click the verification link before signing in.',
          'success'
        );

        $('registerForm').reset();
      }

    } catch (error) {
      console.error('Registration error:', error);
      showMessage(error.message, 'error');

    } finally {
      setBusy(false, 'registerButton');
    }
  });

  // Password recovery
  $('forgotButton').addEventListener('click', async () => {
    const email = $('loginEmail').value.trim();

    if (!email) {
      showMessage('Enter your email address first.', 'error');
      return;
    }

    try {
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: location.origin + '/reset-password.html'
      });

      if (error) throw error;

      showMessage(
        'If the account exists, a password recovery email will be sent.',
        'success'
      );

    } catch (error) {
      console.error('Password recovery error:', error);
      showMessage(error.message, 'error');
    }
  });

  // Refresh account permissions
  $('refreshButton').addEventListener('click', async () => {
    const { data, error } = await sb.auth.getSession();

    if (error || !data.session) {
      lastLoadedToken = null;
      showAuth();

      showMessage(
        'Your session has expired. Please sign in again.',
        'error'
      );

      return;
    }

    lastLoadedToken = null;
    await loadAccount(data.session);
  });

  // Sign out
  $('logoutButton').addEventListener('click', async () => {
    try {
      const { error } = await sb.auth.signOut();

      if (error) throw error;

      await fetch('/.netlify/functions/auth-session', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          clear: true
        })
      });

      currentSession = null;
      lastLoadedToken = null;
      accountLoadId++;

      showAuth();

      showMessage('You have signed out successfully.', 'success');

    } catch (error) {
      console.error('Logout error:', error);
      showAccountMessage(error.message, 'error');
    }
  });

  // Monitor authentication changes
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') {
      currentSession = null;
      lastLoadedToken = null;
      accountLoadId++;

      showAuth();
      return;
    }

    if (
      session &&
      ['SIGNED_IN', 'TOKEN_REFRESHED', 'INITIAL_SESSION'].includes(event)
    ) {
      currentSession = session;

      if (event === 'TOKEN_REFRESHED') {
        syncCookie(session).catch(error => {
          console.error('Session refresh synchronisation error:', error);
        });

      } else {
        setTimeout(() => {
          loadAccount(session);
        }, 0);
      }
    }
  });

  // Restore an existing session
  sb.auth.getSession().then(({ data, error }) => {
    if (error) {
      console.error('Session restoration error:', error);
      showAuth();
      showMessage('Unable to restore your session. Please sign in again.', 'error');
      return;
    }

    if (data.session) {
      loadAccount(data.session);
    } else {
      showAuth();
    }
  });

})();
      </script>
