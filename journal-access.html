<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal Access | Beenorax</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/asset/auth-config.js"></script>

<style>
:root {
  --navy:#10243b;
  --teal:#087f8c;
  --light:#f3f7fa;
  --text:#25364a;
  --muted:#68788b;
  --border:#dce5ec;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--light);
  color:var(--text);
}

header {
  background:var(--navy);
  color:white;
  padding:20px 7%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
}

.brand {
  font-size:21px;
  font-weight:800;
  letter-spacing:1px;
}

.brand span { color:#48c3c1; }

header a {
  color:white;
  text-decoration:none;
  font-size:14px;
}

main {
  max-width:1050px;
  margin:55px auto;
  padding:0 18px;
}

.intro {
  text-align:center;
  margin-bottom:30px;
}

.intro h1 {
  color:var(--navy);
  font-size:32px;
  margin-bottom:10px;
}

.intro p {
  color:var(--muted);
  line-height:1.6;
}

.card {
  background:white;
  max-width:520px;
  margin:auto;
  padding:30px;
  border-radius:14px;
  box-shadow:0 8px 35px rgba(16,36,59,.07);
  border:1px solid var(--border);
}

.tabs {
  display:flex;
  gap:10px;
  margin-bottom:25px;
}

.tabs button {
  flex:1;
  padding:13px;
  border:1px solid var(--border);
  border-radius:7px;
  background:#f5f8fa;
  color:var(--navy);
  font-weight:700;
  cursor:pointer;
}

.tabs button.active {
  background:var(--navy);
  color:white;
}

label {
  display:block;
  font-size:14px;
  font-weight:700;
  margin:15px 0 7px;
}

input, select {
  width:100%;
  padding:13px;
  border:1px solid var(--border);
  border-radius:7px;
  font-size:15px;
  background:white;
}

input:focus, select:focus {
  outline:2px solid rgba(8,127,140,.2);
  border-color:var(--teal);
}

.primary {
  width:100%;
  border:0;
  border-radius:7px;
  background:var(--teal);
  color:white;
  padding:14px;
  margin-top:22px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.primary:disabled {
  opacity:.6;
  cursor:not-allowed;
}

.secondary {
  background:none;
  border:0;
  color:var(--teal);
  cursor:pointer;
  font-weight:700;
  padding:12px 0;
}

.message {
  display:none;
  padding:13px;
  border-radius:7px;
  margin:15px 0;
  font-size:14px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.success {
  display:block;
  background:#e8f7ef;
  color:#17643b;
}

.error {
  display:block;
  background:#fff0ef;
  color:#a32d26;
}

.info {
  display:block;
  background:#edf6fb;
  color:#205775;
}

.hidden { display:none !important; }

.account {
  background:#f5f9fb;
  padding:18px;
  border-radius:9px;
  margin-top:18px;
  line-height:1.7;
  overflow-wrap:anywhere;
}

.account h3 { color:var(--navy); }

.membership {
  background:white;
  border:1px solid var(--border);
  border-radius:8px;
  padding:12px;
  margin:10px 0;
}

footer {
  text-align:center;
  padding:25px;
  color:var(--muted);
  font-size:13px;
}

@media(max-width:600px) {
  main { margin:30px auto; }
  .card { padding:22px; }
  .intro h1 { font-size:26px; }
}
</style>
</head>

<body>

<header>
  <div class="brand">BEENORAX<span>.</span></div>
  <a href="/journal.html">← Back to Journals</a>
</header>

<main>

<section class="intro">
  <h1>Journal Access Portal</h1>
  <p>
    Register or sign in to access manuscript submission,
    peer review and editorial services for Beenorax journals.
  </p>
</section>

<section class="card">

  <div id="authSection">

    <div class="tabs">
      <button id="loginTab" class="active" type="button">Sign in</button>
      <button id="registerTab" type="button">Create account</button>
    </div>

    <div id="message" class="message"></div>

    <form id="loginForm">

      <label for="loginEmail">Email address</label>
      <input id="loginEmail" type="email" required autocomplete="email">

      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" required
        autocomplete="current-password">

      <button class="primary" type="submit" id="loginButton">
        Sign in
      </button>

      <button class="secondary" type="button" id="forgotButton">
        Forgot password?
      </button>

    </form>

    <form id="registerForm" class="hidden">

      <label for="fullName">Full name</label>
      <input id="fullName" type="text" required autocomplete="name">

      <label for="organization">Institution / Organization</label>
      <input id="organization" type="text" autocomplete="organization">

      <label for="requestedRole">Account type</label>
      <select id="requestedRole" required>
        <option value="author">Author</option>
        <option value="reviewer">Reviewer (subject to approval)</option>
        <option value="editor">Editor (subject to appointment)</option>
      </select>

      <label for="registerEmail">Email address</label>
      <input id="registerEmail" type="email" required autocomplete="email">

      <label for="registerPassword">Password</label>
      <input id="registerPassword" type="password"
        minlength="8" required autocomplete="new-password">

      <button class="primary" type="submit" id="registerButton">
        Create account
      </button>

    </form>

  </div>

  <section id="accountSection" class="hidden">

    <div id="accountMessage" class="message info">
      Your account has been authenticated.
    </div>

    <div id="accountDetails" class="account"></div>

    <button class="primary" id="refreshButton" type="button">
      Refresh access
    </button>

    <button class="secondary" id="logoutButton" type="button">
      Sign out
    </button>

  </section>

</section>
</main>

<footer>
  © 2026 Beenorax Analytics & Consulting.
  Journal access and publishing services.
</footer>

<script>
(() => {
  const config = window.BEENORAX_AUTH_CONFIG;

  if (!config || !config.supabaseUrl || !config.supabaseAnonKey) {
    document.getElementById('message').className = 'message error';
    document.getElementById('message').textContent =
      'Authentication configuration is missing.';
    document.getElementById('message').style.display = 'block';
    return;
  }

  const sb = window.supabase.createClient(
    config.supabaseUrl,
    config.supabaseAnonKey,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );

  const $ = id => document.getElementById(id);

  let currentSession = null;
  let busy = false;

  function showMessage(text, type = 'info') {
    const box = $('message');
    box.textContent = text;
    box.className = 'message ' + type;
    box.style.display = 'block';
  }

  function showAccountMessage(text, type = 'info') {
    const box = $('accountMessage');
    box.textContent = text;
    box.className = 'message ' + type;
  }

  function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    })[char]);
  }

  async function syncCookie(session) {
    if (!session?.access_token) return;

    const response = await fetch('/.netlify/functions/auth-session', {
      method:'POST',
      credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        access_token:session.access_token
      })
    });

    if (!response.ok) {
      throw new Error('Could not synchronise your session.');
    }
  }

  async function verifyAccess(session) {
    const response = await fetch('/.netlify/functions/journal-access', {
      method:'GET',
      headers:{
        Authorization:'Bearer ' + session.access_token
      },
      credentials:'same-origin',
      cache:'no-store'
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || 'Access verification failed.');
    }

    return result;
  }

  function showAuth() {
    $('authSection').classList.remove('hidden');
    $('accountSection').classList.add('hidden');
  }

  function showAccount() {
    $('authSection').classList.add('hidden');
    $('accountSection').classList.remove('hidden');
  }

  async function loadAccount(session) {
    if (!session) {
      showAuth();
      return;
    }

    currentSession = session;

    if (!session.user.email_confirmed_at) {
      showAuth();
      showMessage(
        'Please verify your email address before accessing the journal portal.',
        'error'
      );
      return;
    }

    showAccount();
    showAccountMessage('Verifying your journal permissions...');

    try {
      await syncCookie(session);

      const result = await verifyAccess(session);
      const profile = result.profile || {};
      const memberships = result.memberships || [];

      let html = `
        <h3>Account information</h3>
        <strong>Name:</strong>
        ${escapeHTML(profile.full_name || 'Not provided')}<br>

        <strong>Email:</strong>
        ${escapeHTML(result.user.email)}<br>

        <strong>Organization:</strong>
        ${escapeHTML(profile.organization || 'Not provided')}<br>

        <strong>Account role:</strong>
        ${escapeHTML(profile.role || 'Pending assignment')}<br>
      `;

      html += '<h3>Journal permissions</h3>';

      if (memberships.length) {
        memberships.forEach(item => {
          const journal = item.journal_code === 'bjbs'
            ? 'Beenorax Biomedical Journals (BBJ)'
            : item.journal_code === 'bjba'
              ? 'Beenorax Business Intelligence Journals (BBIJ)'
              : item.journal_code;

          html += `
            <div class="membership">
              <strong>${escapeHTML(journal)}</strong><br>
              Role: ${escapeHTML(item.role)}<br>
              Status: Active
            </div>
          `;
        });
      } else {
        html += `
          <p>
            No active editorial or reviewer membership was found.
            You can still use your account as an author when
            manuscript submissions open.
          </p>
        `;
      }

      $('accountDetails').innerHTML = html;

      showAccountMessage(
        'Your account has been verified. Dashboard access will appear when the relevant journal services are configured.',
        'success'
      );

    } catch (error) {
      showAccountMessage(error.message, 'error');
    }
  }

  function setBusy(value, buttonId) {
    busy = value;

    const button = $(buttonId);
    if (button) button.disabled = value;
  }

  $('loginTab').addEventListener('click', () => {
    $('loginForm').classList.remove('hidden');
    $('registerForm').classList.add('hidden');
    $('loginTab').classList.add('active');
    $('registerTab').classList.remove('active');
    $('message').style.display = 'none';
  });

  $('registerTab').addEventListener('click', () => {
    $('registerForm').classList.remove('hidden');
    $('loginForm').classList.add('hidden');
    $('registerTab').classList.add('active');
    $('loginTab').classList.remove('active');
    $('message').style.display = 'none';
  });

  $('loginForm').addEventListener('submit', async event => {
    event.preventDefault();
    if (busy) return;

    setBusy(true, 'loginButton');
    showMessage('Signing in...');

    try {
      const {data, error} = await sb.auth.signInWithPassword({
        email:$('loginEmail').value.trim(),
        password:$('loginPassword').value
      });

      if (error) throw error;

      if (!data.user.email_confirmed_at) {
        await sb.auth.signOut();
        throw new Error('Please verify your email before signing in.');
      }

      await loadAccount(data.session);

    } catch (error) {
      showMessage(error.message, 'error');
    } finally {
      setBusy(false, 'loginButton');
    }
  });

  $('registerForm').addEventListener('submit', async event => {
    event.preventDefault();
    if (busy) return;

    setBusy(true, 'registerButton');
    showMessage('Creating your account...');

    try {
      const {data, error} = await sb.auth.signUp({
        email:$('registerEmail').value.trim(),
        password:$('registerPassword').value,
        options:{
          emailRedirectTo:location.origin + '/journal-access.html',
          data:{
            full_name:$('fullName').value.trim(),
            organization:$('organization').value.trim(),
            requested_role:$('requestedRole').value
          }
        }
      });

      if (error) throw error;

      if (data.session && data.user?.email_confirmed_at) {
        await loadAccount(data.session);
      } else {
        showMessage(
          'Registration received. Check your email and click the verification link before signing in.',
          'success'
        );
        $('registerForm').reset();
      }

    } catch (error) {
      showMessage(error.message, 'error');
    } finally {
      setBusy(false, 'registerButton');
    }
  });

  $('forgotButton').addEventListener('click', async () => {
    const email = $('loginEmail').value.trim();

    if (!email) {
      showMessage('Enter your email address first.', 'error');
      return;
    }

    try {
      const {error} = await sb.auth.resetPasswordForEmail(email, {
        redirectTo:location.origin + '/reset-password.html'
      });

      if (error) throw error;

      showMessage(
        'If the account exists, a password recovery email will be sent.',
        'success'
      );

    } catch (error) {
      showMessage(error.message, 'error');
    }
  });

  $('refreshButton').addEventListener('click', async () => {
    const {data, error} = await sb.auth.getSession();

    if (error || !data.session) {
      showAuth();
      showMessage('Your session has expired. Please sign in again.', 'error');
      return;
    }

    await loadAccount(data.session);
  });

  $('logoutButton').addEventListener('click', async () => {
    try {
      await sb.auth.signOut();

      await fetch('/.netlify/functions/auth-session', {
        method:'POST',
        credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({clear:true})
      });

      currentSession = null;
      showAuth();

    } catch (error) {
      showAccountMessage(error.message, 'error');
    }
  });

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') {
      currentSession = null;
      showAuth();
      return;
    }

    if (
      session &&
      ['SIGNED_IN','TOKEN_REFRESHED','INITIAL_SESSION'].includes(event)
    ) {
      currentSession = session;

      if (event !== 'TOKEN_REFRESHED') {
        setTimeout(() => loadAccount(session), 0);
      } else {
        setTimeout(() => syncCookie(session).catch(console.error), 0);
      }
    }
  });

  sb.auth.getSession().then(({data, error}) => {
    if (error) {
      showAuth();
      return;
    }

    if (data.session) {
      loadAccount(data.session);
    } else {
      showAuth();
    }
  });

})();
</script>

</body>
  </html>
