<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviewer Portal | Beenorax</title><style>:root{--navy:#071f43;--teal:#00a99a;--ink:#17283b;--muted:#64758a;--line:#dce5ed}*{box-sizing:border-box}body{margin:0;background:#f5f8fb;color:var(--ink);font:15px/1.6 Arial,sans-serif}.top{background:#071f43;color:white;padding:18px max(22px,calc((100% - 1120px)/2));display:flex;justify-content:space-between;gap:15px}.top a{color:white;text-decoration:none}.wrap{width:min(1000px,calc(100% - 36px));margin:35px auto}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:24px}.muted{color:var(--muted)}.status{padding:12px 0;color:#087d75}.btn{background:var(--teal);color:white;border:0;border-radius:8px;padding:11px 16px;font-weight:700}.item{padding:18px 0;border-bottom:1px solid var(--line)}label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}textarea,select{width:100%;padding:11px;border:1px solid #cbd7e1;border-radius:8px;font:inherit}textarea{min-height:95px}.hidden{display:none}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/asset/auth-config.js"></script></head><body><header class="top"><a href="/">BEENORAX · Reviewer Portal</a><a href="/publications.html">Publications</a></header><main class="wrap"><section class="card"><h1>Reviewer Portal</h1><p class="muted">Only manuscripts formally assigned to your account are shown here. Keep all manuscript materials confidential.</p><div id="status" class="status"></div><div id="queue"></div></section></main><script>(()=>{const cfg=window.BEENORAX_AUTH_CONFIG||{},$=id=>document.getElementById(id);if(!window.supabase||!cfg.supabaseUrl||cfg.supabaseUrl.includes('YOUR_PROJECT')){$('status').textContent='Reviewer service is not configured.';return}const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);(async()=>{const {data}=await sb.auth.getSession(),session=data.session;if(!session||!session.user.email_confirmed_at){$('status').innerHTML='Please <a href="/access.html?next=/reviewer.html">sign in</a> with your verified account.';return}async function call(action,payload={}){const r=await fetch('/.netlify/functions/journal-api',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...payload})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}try{const d=await call('reviewer_queue');$('status').textContent='Your assigned reviews';$('queue').innerHTML=d.assignments.length?d.assignments.map(a=>{const s=a.journal_submissions||{};return '<article class="item"><b>'+esc(s.title||'Manuscript')+'</b><p class="muted">'+esc((s.journal_code||'').toUpperCase())+' · '+esc(s.reference_code||'')+'</p><form data-id="'+a.id+'"><label>Recommendation</label><select name="recommendation"><option value="minor_revision">Minor revision</option><option value="major_revision">Major revision</option><option value="accept">Accept</option><option value="reject">Reject</option></select><label>Comments for the author</label><textarea name="author_comments" required></textarea><label>Confidential comments to the editor</label><textarea name="confidential_comments"></textarea><button class="btn">Submit review</button></form></article>'}).join(''):'No review assignments are currently available.';$('queue').querySelectorAll('form').forEach(form=>form.onsubmit=async e=>{e.preventDefault();const fd=new FormData(form);const btn=form.querySelector('button');btn.disabled=true;try{await call('submit_review',{assignment_id:form.dataset.id,recommendation:fd.get('recommendation'),author_comments:fd.get('author_comments'),confidential_comments:fd.get('confidential_comments')});form.innerHTML='<b>Review submitted.</b>'}catch(err){alert(err.message);btn.disabled=false}})}catch(e){$('status').textContent=e.message}})();function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}})();</script></body></html>
